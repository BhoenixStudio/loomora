name: Release & Deployment

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish package to npm'
        type: boolean
        default: true
      deploy_docs:
        description: 'Deploy documentation to Cloudflare Pages'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run Vitest tests
        run: pnpm run test:run

      - name: Validate Playground
        run: pnpm run check:playground

  publish-npm:
    name: Publish to npm
    needs: [validate]
    if: ${{ github.event_name == 'release' || inputs.publish_npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js (Node 24 includes npm >= 11.5.1 for OIDC Trusted Publishing)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library
        run: pnpm run build

      - name: Verify package bundle
        run: pnpm run pack:dry

      - name: Publish to npm via OIDC Trusted Publishing
        run: npm publish --access public --provenance

  deploy-docs:
    name: Deploy Docs to Cloudflare Pages
    needs: [validate]
    if: ${{ github.event_name == 'release' || inputs.deploy_docs }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build library package
        run: pnpm run build

      - name: Build and Export Playground
        run: pnpm --filter loomora-playground build
        env:
          NEXT_EXPORT: 'true'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy playground/out --project-name=loomora-docs --branch=main --commit-dirty=true
